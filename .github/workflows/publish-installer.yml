name: Publish installer to existing signed Release site

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Latest stable signed Release tag (example: v1.5.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: turnshade-crx-pages-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify immutable CRX and stage installer without signing
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@v4

      - name: Verify latest stable Release and its signed CRX checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_ID: ${{ vars.TURNSHADE_EXTENSION_ID }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]] || {
            echo "::error::Invalid release tag"; exit 1;
          }
          [[ "$EXPECTED_ID" =~ ^[a-p]{32}$ ]] || {
            echo "::error::TURNSHADE_EXTENSION_ID must be a 32-character a-p ID"; exit 1;
          }
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName')"
          [[ "$latest" == "$RELEASE_TAG" ]] || {
            echo "::error::Only latest stable Release may be republished"; exit 1;
          }
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "turnshade-$RELEASE_TAG.crx" \
            --pattern "turnshade-$RELEASE_TAG.crx.sha256" \
            --pattern "turnshade-$RELEASE_TAG.zip" \
            --pattern "turnshade-$RELEASE_TAG.zip.sha256" \
            --dir dist
          (cd dist && sha256sum --check "turnshade-$RELEASE_TAG.crx.sha256")
          (cd dist && sha256sum --check "turnshade-$RELEASE_TAG.zip.sha256")
          unzip -p "dist/turnshade-$RELEASE_TAG.zip" manifest.json > dist/release-manifest.json
          python3 scripts/build_update_site.py \
            --crx "dist/turnshade-$RELEASE_TAG.crx" \
            --manifest dist/release-manifest.json \
            --tag "$RELEASE_TAG" --expected-id "$EXPECTED_ID" \
            --output pages-site
          cmp "dist/turnshade-$RELEASE_TAG.crx" "pages-site/turnshade-$RELEASE_TAG.crx"
          sh -n pages-site/install.sh
          echo "Installer staged without changing or re-signing the released CRX."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages with signed CRX, updates.xml and install.sh
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy:
    name: Publish installer and retain existing signed CRX
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy updated GitHub Pages site
        id: deploy
        uses: actions/deploy-pages@v4

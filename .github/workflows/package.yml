name: Package Chrome extension

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turnshade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Test and package TurnShade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.build.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check service-worker.js
          node --check content.js
          node --check popup.js

      - name: Test background logic
        run: node --test tests/service-worker.test.cjs

      - name: Build installable ZIP (only approved assets)
        id: build
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          root = Path.cwd()
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('manifest_version') == 3, 'Manifest V3 is required'
          version = manifest.get('version')
          assert isinstance(version, str) and re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,3}', version), 'Invalid extension version'
          files = (
              'manifest.json', 'service-worker.js', 'content.js',
              'popup.html', 'popup.js',
              'icons/icon16.png', 'icons/icon48.png', 'icons/icon128.png',
          )
          for path in files:
              item = root / path
              if not item.is_file() or item.is_symlink():
                  raise SystemExit(f'Missing or unsafe file: {path}')
          for size in (16, 48, 128):
              path = f'icons/icon{size}.png'
              assert manifest['icons'][str(size)] == path
              assert manifest['action']['default_icon'][str(size)] == path
              assert (root / path).read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), f'Invalid PNG: {path}'
          assert manifest['action']['default_popup'] == 'popup.html'
          assert manifest['background']['service_worker'] == 'service-worker.js'
          assert manifest['content_scripts'][0]['js'] == ['content.js']

          out = root / 'dist' / f'turnshade-v{version}.zip'
          out.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(out, 'w', ZIP_DEFLATED, compresslevel=9) as z:
              for path in files:
                  data = (root / path).read_bytes()
                  info = ZipInfo(path, (2026, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  z.writestr(info, data)
          with ZipFile(out) as z:
              assert z.testzip() is None, 'CRC error'
              assert sorted(z.namelist()) == sorted(files), 'Unexpected files in ZIP'
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          print(f'Created {out.relative_to(root)} ({out.stat().st_size} bytes)')
          print(f'SHA-256: {digest}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'version={version}\n')
              f.write(f'zip_path=dist/turnshade-v{version}.zip\n')
          PY

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnshade-v${{ steps.build.outputs.version }}-${{ github.run_number }}
          path: ${{ steps.build.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: package
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated extension ZIP
        uses: actions/download-artifact@v4
        with:
          name: turnshade-v${{ needs.package.outputs.version }}-${{ github.run_number }}
          path: dist

      - name: Publish immutable versioned Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          zip="dist/turnshade-$tag.zip"
          test -f "$zip"
          (cd dist && sha256sum "turnshade-$tag.zip" > "turnshade-$tag.zip.sha256")

          # A superseded run must never publish its obsolete commit as a release.
          master_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          if [[ "$master_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale run: master has moved from $GITHUB_SHA to $master_sha"
            exit 0
          fi

          # An existing release is immutable; bump manifest.json for a new release.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists. No asset overwrite; bump manifest version for a new release."
            exit 0
          fi

          # An orphan tag can be reused only when it points at this exact commit.
          if tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null)"; then
            tag_sha="$(jq -r '.object.sha' <<< "$tag_ref")"
            tag_type="$(jq -r '.object.type' <<< "$tag_ref")"
            if [[ "$tag_type" == "tag" ]]; then
              tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
            fi
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already points at $tag_sha, not $GITHUB_SHA. Refusing to republish."
              exit 1
            fi
          fi

          cat > dist/RELEASE_NOTES.md <<EOF
          TurnShade $tag: Chrome extension for turn-taking in split-screen ChatGPT conversations.

          - Shades the ChatGPT pane that just sent a message.
          - Unshades the other pane so the next turn is clear.
          - Includes a popup for manual shading, pairing diagnostics, and reset.
          - Includes the TurnShade icons.

          Install: download **turnshade-$tag.zip** from Assets, extract it, and load the extracted directory via chrome://extensions (Developer mode -> Load unpacked). Reload both ChatGPT tabs.

          SHA-256 is provided as a separate .sha256 release asset.
          EOF

          gh release create "$tag" "$zip" "$zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TurnShade $tag" \
            --notes-file dist/RELEASE_NOTES.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'

name: Package Chrome extension

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turnshade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Test and package TurnShade
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      version: ${{ steps.build.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check service-worker.js
          node --check content.js
          node --check popup.js

      - name: Test background logic
        run: node --test tests/service-worker.test.cjs

      - name: Test CRX and offline curl-installer safety
        run: |
          python3 -m unittest discover -s tests -p 'test_crx_*.py'
          python3 -m unittest discover -s tests -p 'test_installer.py'
          sh -n scripts/install.sh

      - name: Build installable ZIP (only approved assets)
        id: build
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          root = Path.cwd()
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('manifest_version') == 3, 'Manifest V3 is required'
          version = manifest.get('version')
          assert isinstance(version, str) and re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,3}', version), 'Invalid extension version'
          files = (
              'manifest.json', 'service-worker.js', 'content.js',
              'popup.html', 'popup.js',
              'icons/icon16.png', 'icons/icon48.png', 'icons/icon128.png',
          )
          for path in files:
              item = root / path
              if not item.is_file() or item.is_symlink():
                  raise SystemExit(f'Missing or unsafe file: {path}')
          for size in (16, 48, 128):
              path = f'icons/icon{size}.png'
              assert manifest['icons'][str(size)] == path
              assert manifest['action']['default_icon'][str(size)] == path
              assert (root / path).read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), f'Invalid PNG: {path}'
          assert manifest['action']['default_popup'] == 'popup.html'
          assert manifest['background']['service_worker'] == 'service-worker.js'
          assert manifest['content_scripts'][0]['js'] == ['content.js']

          out = root / 'dist' / f'turnshade-v{version}.zip'
          out.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(out, 'w', ZIP_DEFLATED, compresslevel=9) as z:
              for path in files:
                  data = (root / path).read_bytes()
                  info = ZipInfo(path, (2026, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  z.writestr(info, data)
          with ZipFile(out) as z:
              assert z.testzip() is None, 'CRC error'
              assert sorted(z.namelist()) == sorted(files), 'Unexpected files in ZIP'
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          print(f'Created {out.relative_to(root)} ({out.stat().st_size} bytes)')
          print(f'SHA-256: {digest}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'version={version}\n')
              f.write(f'zip_path=dist/turnshade-v{version}.zip\n')
          PY

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnshade-v${{ steps.build.outputs.version }}-${{ github.run_number }}
          path: ${{ steps.build.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0


  crx-smoke:
    name: Smoke-test Chrome CRX3 packaging with ephemeral key
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download the same tested ZIP
        uses: actions/download-artifact@v4
        with:
          name: turnshade-v${{ needs.package.outputs.version }}-${{ github.run_number }}
          path: dist

      - name: Sign test-only CRX3 with a throwaway key (never published)
        shell: bash
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          openssl genrsa -out "$RUNNER_TEMP/crx-smoke.pem" 3072
          bash scripts/pack_crx.sh "dist/turnshade-v$VERSION.zip" \
            "v$VERSION" "$RUNNER_TEMP/crx-smoke.pem" "$RUNNER_TEMP/crx-out"
          test -s "$RUNNER_TEMP/crx-out/turnshade-v$VERSION.crx"
          CRX_TEST_VERSION="$VERSION" python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.build_update_site import build_site, extension_id_from_key
          version = os.environ["CRX_TEST_VERSION"]
          key = Path(os.environ["RUNNER_TEMP"]) / "crx-smoke.pem"
          artifact = Path(os.environ["RUNNER_TEMP"]) / "crx-out" / f"turnshade-v{version}.crx"
          expected_id, _ = extension_id_from_key(key)
          build_site(artifact, key, Path("manifest.json"), f"v{version}",
                     expected_id, Path(os.environ["RUNNER_TEMP"]) / "pages-smoke")
          PY
          echo "Test-only CRX3 + update site produced with an ephemeral key (never published)"

  release:
    name: Manage version and GitHub Release (Google release-please)
    needs: [package, crx-smoke]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release PR / GitHub Release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Download tested ZIP
        if: steps.release.outputs.release_created == 'true'
        uses: actions/download-artifact@v4
        with:
          name: turnshade-v${{ needs.package.outputs.version }}-${{ github.run_number }}
          path: dist

      - name: Verify version and attach ZIP and SHA-256
        if: steps.release.outputs.release_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Release version $RELEASE_VERSION does not match packaged manifest version $BUILD_VERSION"
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$RELEASE_VERSION" ]]; then
            echo "::error::Unexpected release tag: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$RELEASE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Release points to $RELEASE_SHA rather than the tested commit $GITHUB_SHA"
            exit 1
          fi
          zip="dist/turnshade-$RELEASE_TAG.zip"
          test -f "$zip"
          (cd dist && sha256sum "turnshade-$RELEASE_TAG.zip" > "turnshade-$RELEASE_TAG.zip.sha256")
          gh release upload "$RELEASE_TAG" "$zip" "$zip.sha256" --repo "$GITHUB_REPOSITORY"
          echo "Published ZIP and checksum to:"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'

  publish-crx:
    name: Publish signed CRX and GitHub Pages update
    needs: [package, release]
    if: needs.release.outputs.release_created == 'true' && vars.TURNSHADE_CRX_PUBLISH_ENABLED == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/sign-crx.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    secrets: inherit

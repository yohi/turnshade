name: Sign CRX for published Release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing, published Release tag (example: v1.4.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign-crx:
    name: Sign CRX3 and attach to existing Release
    if: github.ref == 'refs/heads/master'
    # Can optionally require human approval in Settings > Environments.
    environment: crx-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out trusted default-branch tooling
        uses: actions/checkout@v4

      - name: Validate release and download its already-tested ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]] || {
            echo "::error::Invalid Release tag"; exit 1;
          }
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft --jq 'select(.isDraft == false) | .tagName' |
            grep -Fx "$RELEASE_TAG" >/dev/null || {
              echo "::error::Only existing published Releases may be signed"; exit 1;
            }
          # Never replace a previously signed package silently.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              grep -Fx "turnshade-$RELEASE_TAG.crx"; then
            echo "::error::This Release already has a CRX; refusing to overwrite"; exit 1;
          fi
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "turnshade-$RELEASE_TAG.zip" --pattern "turnshade-$RELEASE_TAG.zip.sha256" --dir dist
          test -s "dist/turnshade-$RELEASE_TAG.zip"
          test -s "dist/turnshade-$RELEASE_TAG.zip.sha256"
          (cd dist && sha256sum --check "turnshade-$RELEASE_TAG.zip.sha256")

      - name: Sign, verify CRX3 header and publish assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CRX_SIGNING_KEY_PEM: ${{ secrets.TURNSHADE_CRX_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$CRX_SIGNING_KEY_PEM" ]] || {
            echo "::error::Secret TURNSHADE_CRX_PRIVATE_KEY_PEM is missing (no CRX published)"; exit 1;
          }
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"; unset CRX_SIGNING_KEY_PEM' EXIT
          printf '%s\n' "$CRX_SIGNING_KEY_PEM" > "$key_dir/signing.pem"
          unset CRX_SIGNING_KEY_PEM
          bash scripts/pack_crx.sh "dist/turnshade-$RELEASE_TAG.zip" "$RELEASE_TAG" "$key_dir/signing.pem" dist
          gh release upload "$RELEASE_TAG" "dist/turnshade-$RELEASE_TAG.crx" "dist/turnshade-$RELEASE_TAG.crx.sha256" --repo "$GITHUB_REPOSITORY"
          echo "Signed CRX and SHA-256 attached to existing Release $RELEASE_TAG"

name: Publish signed CRX and Chrome update site

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Latest published Release tag with update_url (for example v1.5.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: turnshade-crx-pages-publish
  cancel-in-progress: false

jobs:
  sign-crx:
    name: Sign existing Release and stage GitHub Pages
    if: github.ref == 'refs/heads/master'
    environment: crx-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out trusted default-branch tooling
        uses: actions/checkout@v4

      - name: Verify publish policy and Release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_ID: ${{ vars.TURNSHADE_EXTENSION_ID }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]] || {
            echo "::error::Invalid release tag"; exit 1;
          }
          [[ "$EXPECTED_ID" =~ ^[a-p]{32}$ ]] || {
            echo "::error::Configure TURNSHADE_EXTENSION_ID repository variable first"; exit 1;
          }
          [[ "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName')" == "$RELEASE_TAG" ]] || {
            echo "::error::Only the latest stable published Release may update Pages"; exit 1;
          }
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "turnshade-$RELEASE_TAG.zip" \
            --pattern "turnshade-$RELEASE_TAG.zip.sha256" --dir dist
          test -s "dist/turnshade-$RELEASE_TAG.zip"
          test -s "dist/turnshade-$RELEASE_TAG.zip.sha256"
          (cd dist && sha256sum --check "turnshade-$RELEASE_TAG.zip.sha256")

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Sign CRX3, validate key identity and build atomic update site
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_ID: ${{ vars.TURNSHADE_EXTENSION_ID }}
          CRX_SIGNING_KEY_PEM: ${{ secrets.TURNSHADE_CRX_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$CRX_SIGNING_KEY_PEM" ]] || {
            echo "::error::TURNSHADE_CRX_PRIVATE_KEY_PEM is not configured"; exit 1;
          }
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"; unset CRX_SIGNING_KEY_PEM' EXIT
          printf '%s\n' "$CRX_SIGNING_KEY_PEM" > "$key_dir/signing.pem"
          unset CRX_SIGNING_KEY_PEM
          bash scripts/pack_crx.sh "dist/turnshade-$RELEASE_TAG.zip" \
            "$RELEASE_TAG" "$key_dir/signing.pem" dist
          unzip -p "dist/turnshade-$RELEASE_TAG.zip" manifest.json > "$key_dir/manifest.json"
          python3 scripts/build_update_site.py \
            --crx "dist/turnshade-$RELEASE_TAG.crx" \
            --key "$key_dir/signing.pem" \
            --manifest "$key_dir/manifest.json" \
            --tag "$RELEASE_TAG" --expected-id "$EXPECTED_ID" \
            --output pages-site
          cmp "dist/turnshade-$RELEASE_TAG.crx" "pages-site/turnshade-$RELEASE_TAG.crx"

      - name: Upload signed CRX and checksum to Release (idempotent, fail on conflict)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t names < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')
          crx="turnshade-$RELEASE_TAG.crx"
          checksum="$crx.sha256"
          if printf '%s\n' "${names[@]}" | grep -Fxq "$crx"; then
            printf '%s\n' "${names[@]}" | grep -Fxq "$checksum" || {
              echo "::error::Partial signed assets on Release"; exit 1;
            }
            mkdir -p existing
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$crx" --pattern "$checksum" --dir existing
            (cd existing && sha256sum --check "$checksum")
            cmp "existing/$crx" "dist/$crx" || {
              echo "::error::Existing signed Release differs; refusing overwrite"; exit 1;
            }
          else
            if printf '%s\n' "${names[@]}" | grep -Fxq "$checksum"; then
              echo "::error::Partial signed assets on Release"; exit 1
            fi
            gh release upload "$RELEASE_TAG" "dist/$crx" "dist/$checksum" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload atomic Pages artifact with CRX and update XML
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy-pages:
    name: Deploy signed update site to GitHub Pages
    needs: sign-crx
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy update site
        id: deployment
        uses: actions/deploy-pages@v4
